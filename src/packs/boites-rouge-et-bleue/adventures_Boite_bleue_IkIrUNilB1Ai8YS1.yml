name: Boite bleue
img: modules/dg-boite-rouge-bleue/assets/dg-scenes/bannire_boite_bleue.webp
caption: ''
description: "<h3>Campagne de Dangerous Gary 2/2</h3><p><em>Betty était épuisée. L’odeur de la poudre saturait l’air. Guillaume, assis sur le sol et les yeux fermés, murmurait une prière que la jeune femme avait déjà entendue dans la bouche d’un adepte de la Fraternité Saint-Minos : « Ceux qui se perdent dans le dédale sont comme des brebis égarées cherchant leur chemin dans la nuit. Mais celui qui suit le berger de l’âme, celui-là ne sera pas perdu, et il trouvera la Porte étroite et la vie éternelle ».</em></p><p><em>Betty courait comme elle n’avait jamais couru. La lumière de sa lampe-torche zébrait l’obscurité d’éclairs blancs et fugaces. Malgré le grondement du sang affluant à ses oreilles, elle entendait l’horrible crissement des griffes de la liche sur les murs métalliques. Le Monstre aux yeux lavande se rapprochait inexorablement. Betty hurla de terreur.</em></p><p><strong>Le Mall, La Bibliothèque, La Salle des cartes, la Chambre bleue, le Labyrinthe, la Cathédrale… Qu’apprendrez-vous si vous osez affronter les Donjons\_?</strong></p>"
